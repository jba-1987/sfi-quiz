async function saveResult(quizId, quizTheme, score, total, answersArr) {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/quiz_results', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ student_name: userName, quiz_id: quizId, quiz_theme: quizTheme, score: score, total: total, answers: answersArr })
    });
  } catch(e) { console.error('Save failed:', e); }

let currentQuiz = null;
let userName = '';
let userAnswers = [];
let submitted = false;
let phase = 'landing';
const letters = ['A','B','C','D'];
const main = document.getElementById('mainContent');

function init() {
  const hash = window.location.hash.replace('#','');
  if (!hash) { phase = 'landing'; render(); return; }
  const quiz = QUIZZES.find(q => q.id === hash);
  if (!quiz) { phase = 'landing'; render(); return; }
  currentQuiz = quiz;
  userAnswers = new Array(quiz.questions.length).fill(null);
  submitted = false;
  userName = '';
  phase = 'quiz';
  render();
}

window.addEventListener('hashchange', init);

function render() {
  if (phase === 'landing') { renderLanding(); return; }
  if (phase === 'results') { renderResults(); return; }
  renderQuiz();
}

function renderLanding() {
  main.innerHTML = `<div class="landing"><div class="landing-card">
    <div class="landing-title">SFI Quiz</div>
    <p class="landing-text">Quiz till Johns SFI-lektioner.<br>Öppna länken från din landningssida för att starta ett quiz.</p>
  </div></div>`;
}

function renderQuiz() {
  const questionsHtml = currentQuiz.questions.map((q, qi) => {
    const optionsHtml = q.options.map((opt, oi) => {
      let cls = 'option-item';
      if (submitted) {
        cls += ' locked';
        if (oi === q.correct && userAnswers[qi] === oi) cls = 'option-item locked correct';
        else if (oi === q.correct) cls += ' show-correct';
        else if (userAnswers[qi] === oi) cls += ' wrong';
      } else if (userAnswers[qi] === oi) {
        cls += ' selected';
      }
      const click = submitted ? '' : `onclick="selectAnswer(${qi},${oi})"`;
      return `<div class="${cls}" ${click}>
        <div class="option-radio"></div>
        <span class="option-letter">${letters[oi]})</span>
        <span class="option-text">${opt}</span>
      </div>`;
    }).join('');
    return `<div class="card question-block-${qi}">
      <div class="question-num">Fråga ${qi+1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options-list">${optionsHtml}</div>
    </div>`;
  }).join('');

  const canSubmit = userAnswers.every(a => a !== null) && userName.trim().length >= 2;

  main.innerHTML = `
    <div class="card quiz-title-card">
      <div class="quiz-theme">${currentQuiz.theme}</div>
      <div class="quiz-dates">${currentQuiz.dates}</div>
      <div class="quiz-desc">Läs texten för lektionen och svara sedan på ${currentQuiz.questions.length} frågor.</div>
    </div>
    <div class="card">
      <label class="name-label" for="nameInput">Ditt namn</label>
      <input class="name-input" id="nameInput" type="text" placeholder="Skriv ditt namn här..." autocomplete="off" value="${submitted ? userName : ''}" ${submitted ? 'disabled' : ''} oninput="onNameInput(this.value)">
      <div id="nameError" style="display:none;color:#ff0000;font-size:0.82rem;font-weight:700;margin-top:6px;">Du måste skriva in ditt namn innan du skickar in svaret.</div>
    </div>
    ${questionsHtml}
    ${!submitted
      ? `<button class="submit-btn" id="submitBtn" onclick="submitAnswers()" ${userAnswers.every(a => a !== null) ? '' : 'disabled'}>Skicka in svar</button>`
      : ''}`;


}

function onNameInput(val) {
  userName = val.trim();
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !(userAnswers.every(a => a !== null) && userName.length >= 2);
}

function selectAnswer(qi, oi) {
  if (submitted) return;
  const nameInp = document.getElementById('nameInput');
  if (nameInp) userName = nameInp.value.trim();
  userAnswers[qi] = oi;
  // Only update this question's options, no full re-render = no scroll
  const block = document.querySelector('.question-block-' + qi);
  if (block) {
    block.querySelectorAll('.option-item').forEach((el, idx) => {
      el.className = idx === oi ? 'option-item selected' : 'option-item';
    });
  }
  // Update submit button
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !(userAnswers.every(a => a !== null) && userName.length >= 2);
}

function submitAnswers() {
  const inp = document.getElementById('nameInput');
  if (inp) userName = inp.value.trim();
  if (userName.length < 2) {
    if (inp) {
      inp.style.borderColor = '#ff0000';
      inp.style.borderWidth = '3px';
      const err = document.getElementById('nameError');
      if (err) err.style.display = 'block';
    }
    return;
  }
  if (userAnswers.some(a => a === null)) return;
  const score = userAnswers.filter((a,i) => a === currentQuiz.questions[i].correct).length;
  saveResult(currentQuiz.id, currentQuiz.theme, score, currentQuiz.questions.length, userAnswers);
  phase = 'results';
  render();
  window.scrollTo(0, 0);
}

function showResults() {}

function renderResults() {
  const total = currentQuiz.questions.length;
  const score = userAnswers.filter((a,i) => a === currentQuiz.questions[i].correct).length;
  const pct = Math.round(score/total*100);
  const barColor = pct >= 80 ? '#00b050' : pct >= 60 ? '#ffc000' : '#ff0000';

  const reviewHtml = currentQuiz.questions.map((q,i) => {
    const ua = userAnswers[i];
    const ok = ua === q.correct;
    return `<div class="review-item">
      <div class="review-q">${i+1}. ${q.q}</div>
      ${ok
        ? `<div class="review-ok">✓ ${letters[ua]}) ${q.options[ua]}</div>`
        : `<div class="review-your">✗ Ditt svar: ${ua !== null ? letters[ua]+') '+q.options[ua] : '(inget svar)'}</div>
           <div class="review-correct">✓ Rätt: ${letters[q.correct]}) ${q.options[q.correct]}</div>`}
    </div>`;
  }).join('');

  main.innerHTML = `<div class="card">
    <div class="results-score">${score}/${total}</div>
    <div class="results-label">poäng · ${pct}%</div>
    <div class="results-bar"><div class="results-bar-fill" id="resBar" style="width:0%;background:${barColor}"></div></div>
    <div style="text-align:center;font-size:0.9rem;font-weight:700;margin-top:8px">${userName}</div>
    <div style="text-align:center;font-size:0.82rem;color:#444;font-style:italic;margin-top:3px">${currentQuiz.theme}</div>
    <div class="review-title">Genomgång</div>
    ${reviewHtml}
    <button class="restart-btn" onclick="restartQuiz()">Försök igen</button>
  </div>`;
  setTimeout(() => { const b = document.getElementById('resBar'); if(b) b.style.width = pct+'%'; }, 100);
}

function restartQuiz() {
  userAnswers = new Array(currentQuiz.questions.length).fill(null);
  submitted = false;
  userName = '';
  phase = 'quiz';
  render();
  window.scrollTo(0, 0);
}

init();
