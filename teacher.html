<script>
const SUPABASE_URL = "https://dszfynsqxdgsakfckquo.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzemZ5bnNxeGRnc2FrZmNrcXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzQ1MDIsImV4cCI6MjA5MjY1MDUwMn0.fC90kH2Y9rqedmwbYB856JqC1-lvYWb1JJry4pGnMqg";
const PASSWORD = "sfi2026"; // Change this to your preferred password

let allResults = [];
let sortCol = 'created_at';
let sortAsc = false;

// ── AUTH ──
function login() {
  const pw = document.getElementById('pwInput').value;
  if (pw === PASSWORD) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadResults();
  } else {
    document.getElementById('loginError').classList.remove('hidden');
  }
}

function logout() {
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('pwInput').value = '';
}

// ── LOAD DATA ──
async function loadResults() {
  document.getElementById('loadingMsg').classList.remove('hidden');
  document.getElementById('resultsTable').classList.add('hidden');
  document.getElementById('emptyState').classList.add('hidden');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/quiz_results?select=*&order=created_at.desc`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
    allResults = await res.json();
    populateFilters();
    applyFilters();
  } catch(e) {
    document.getElementById('loadingMsg').textContent = 'Fel: kunde inte ladda resultat.';
  }
}

// ── FILTERS ──
function populateFilters() {
  const quizSel = document.getElementById('filterQuiz');
  const studentSel = document.getElementById('filterStudent');
  const quizCurrent = quizSel.value;
  const studentCurrent = studentSel.value;

  const quizzes = [...new Set(allResults.map(r => r.quiz_theme))].sort();
  const students = [...new Set(allResults.map(r => r.student_name))].sort();

  quizSel.innerHTML = '<option value="">Alla quiz</option>' +
    quizzes.map(q => `<option value="${q}" ${q===quizCurrent?'selected':''}>${q}</option>`).join('');
  studentSel.innerHTML = '<option value="">Alla elever</option>' +
    students.map(s => `<option value="${s}" ${s===studentCurrent?'selected':''}>${s}</option>`).join('');
}

function applyFilters() {
  const qf = document.getElementById('filterQuiz').value;
  const sf = document.getElementById('filterStudent').value;

  let filtered = allResults.filter(r =>
    (!qf || r.quiz_theme === qf) &&
    (!sf || r.student_name === sf)
  );

  // Add pct field
  filtered = filtered.map(r => ({ ...r, pct: r.total ? Math.round(r.score/r.total*100) : 0 }));

  // Sort
  filtered.sort((a, b) => {
    let av = a[sortCol] ?? '';
    let bv = b[sortCol] ?? '';
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    return sortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
  });

  renderTable(filtered);
  updateStats(filtered);
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  applyFilters();
}

// ── RENDER ──
function renderTable(rows) {
  document.getElementById('loadingMsg').classList.add('hidden');

  if (rows.length === 0) {
    document.getElementById('resultsTable').classList.add('hidden');
    document.getElementById('emptyState').classList.remove('hidden');
    return;
  }

  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('resultsTable').classList.remove('hidden');

  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = rows.map((r, idx) => {
    const pct = r.total ? Math.round(r.score/r.total*100) : 0;
    const badgeClass = pct >= 80 ? 'score-high' : pct >= 60 ? 'score-mid' : 'score-low';
    const date = new Date(r.created_at).toLocaleDateString('sv-SE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const rowId = `row_${idx}`;
    const detail = buildAnswerDetail(r, rowId);
    return `<tr>
      <td><strong>${esc(r.student_name)}</strong></td>
      <td>${esc(r.quiz_theme || r.quiz_id)}</td>
      <td>${r.score} / ${r.total}</td>
      <td><span class="score-badge ${badgeClass}">${pct}%</span></td>
      <td style="color:#444">${date}</td>
      <td><button class="expand-btn" onclick="toggleAnswers('${rowId}')">Visa svar</button></td>
    </tr>
    <tr class="answers-row"><td colspan="6"><div class="answers-detail" id="detail_${rowId}">${detail}</div></td></tr>`;
  }).join('');
}

function updateStats(rows) {
  document.getElementById('statTotal').textContent = rows.length;
  document.getElementById('statStudents').textContent = new Set(rows.map(r => r.student_name)).size;
  document.getElementById('statQuizzes').textContent = new Set(rows.map(r => r.quiz_id)).size;
  const avg = rows.length ? Math.round(rows.reduce((s,r) => s + (r.total ? r.score/r.total*100 : 0), 0) / rows.length) : 0;
  document.getElementById('statAvg').textContent = rows.length ? avg + '%' : '–';
}

// ── EXPORT ──
function exportCSV() {
  const qf = document.getElementById('filterQuiz').value;
  const sf = document.getElementById('filterStudent').value;
  let rows = allResults.filter(r => (!qf || r.quiz_theme === qf) && (!sf || r.student_name === sf));

  const header = ['Elev','Quiz','Poäng','Total','%','Datum'];
  const lines = rows.map(r => {
    const pct = r.total ? Math.round(r.score/r.total*100) : 0;
    const date = new Date(r.created_at).toLocaleDateString('sv-SE');
    return [r.student_name, r.quiz_theme||r.quiz_id, r.score, r.total, pct+'%', date].join(',');
  });

  const csv = [header.join(','), ...lines].join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sfi_quiz_resultat_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleAnswers(rowId) {
  const el = document.getElementById('detail_' + rowId);
  if (el) el.classList.toggle('open');
}

function buildAnswerDetail(r, rowId) {
  if (!r.answers || !Array.isArray(r.answers) || r.answers.length === 0) return '<em>Inga detaljerade svar sparade.</em>';
  // New format: each answer is an object with question, selectedText, correctText, isCorrect
  if (r.answers[0] && typeof r.answers[0] === 'object' && 'question' in r.answers[0]) {
    return r.answers.map((a, i) => {
      return `<div class="answer-item">
        <span class="answer-q">${i+1}. ${esc(a.question)}</span>
        ${a.isCorrect
          ? `<span class="answer-correct">✓ ${esc(a.selectedText || '')}</span>`
          : `<span class="answer-wrong">✗ ${esc(a.selectedText || '(inget svar)')}</span><span class="answer-correct">✓ ${esc(a.correctText || '')}</span>`}
      </div>`;
    }).join('');
  }
  // Old format fallback: index array, try QUIZ_DATA
  const qdata = QUIZ_DATA[r.quiz_id];
  if (!qdata) return '<em>Inga detaljerade svar sparade.</em>';
  const letters = ['A','B','C','D'];
  return qdata.questions.map((q, i) => {
    const ua = r.answers[i];
    const correct = q.correct;
    const ok = ua === correct;
    const uaText = ua !== null && ua !== undefined ? `${letters[ua]}) ${q.options[ua]}` : '(inget svar)';
    const correctText = `${letters[correct]}) ${q.options[correct]}`;
    return `<div class="answer-item">
      <span class="answer-q">${i+1}. ${esc(q.q)}</span>
      ${ok
        ? `<span class="answer-correct">✓ ${esc(uaText)}</span>`
        : `<span class="answer-wrong">✗ ${esc(uaText)}</span><span class="answer-correct">✓ ${esc(correctText)}</span>`}
    </div>`;
  }).join('');
}
